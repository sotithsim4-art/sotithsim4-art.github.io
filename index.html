<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sotith Sim | Cybersecurity Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="hub-body">

  <main class="hub-main">

    <div class="hub-header">
      <div class="logo">CYBERSEC</div>
      <h1 class="hub-title">SELECT DASHBOARD</h1>
      <p class="hub-tagline">Sotith Sim — SOC Analyst • Army Veteran • Cybersecurity</p>
    </div>

    <div class="hub-terminal">
      <div class="terminal-header">
        <span class="terminal-title">BOOT SEQUENCE</span>
        <span class="terminal-dot red"></span>
        <span class="terminal-dot yellow"></span>
        <span class="terminal-dot green"></span>
      </div>
      <div class="terminal-body">
        <div id="terminal-output"></div>
        <form id="hub-prompt" class="hub-prompt" hidden>
          <label for="hub-command">sotith@hub:~$</label>
          <input id="hub-command" name="command" autocomplete="off" spellcheck="false" aria-label="Hub command" />
        </form>
        <span class="terminal-cursor" id="boot-cursor">█</span>
      </div>
    </div>

    <div class="hub-grid" id="hub-grid"></div>

    <section class="iam-section" id="iam">
      <h2 class="section-title">IAM TOOLS</h2>
      <div class="hub-grid" id="iam-grid"></div>
    </section>

    <div class="hub-footer">
      <a href="https://github.com/sotithsim4-art" target="_blank">GitHub</a>
      <a href="https://tryhackme.com/p/sotithsim4" target="_blank">TryHackMe</a>
    </div>

  </main>

  <script src="dashboards.js"></script>
  <script>
    renderHub();
    renderIam();

    const lines = bootSequenceLines();
    const output = document.getElementById("terminal-output");
    let lineIndex = 0;
    let charIndex = 0;
    let completedHTML = "";

    function type() {
      if (lineIndex >= lines.length) {
        startShell();
        return;
      }
      const line = lines[lineIndex];
      if (charIndex < line.length) {
        charIndex++;
        output.innerHTML = completedHTML + line.substring(0, charIndex);
        setTimeout(type, 30);
      } else {
        completedHTML += line + "<br/>";
        output.innerHTML = completedHTML;
        charIndex = 0;
        lineIndex++;
        setTimeout(type, 400);
      }
    }

    function appendLine(text, className) {
      const row = document.createElement("div");
      row.className = className;
      row.textContent = text;
      output.appendChild(row);
    }

    function startShell() {
      const form = document.getElementById("hub-prompt");
      const input = document.getElementById("hub-command");
      const title = document.querySelector(".hub-terminal .terminal-title");
      const history = [];
      let historyIndex = 0;

      document.getElementById("boot-cursor").hidden = true;
      form.hidden = false;
      title.textContent = "HUB SHELL";
      input.focus();

      input.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
        event.preventDefault();
        if (event.key === "ArrowUp" && historyIndex > 0) {
          historyIndex -= 1;
          input.value = history[historyIndex];
        }
        if (event.key === "ArrowDown") {
          if (historyIndex < history.length - 1) {
            historyIndex += 1;
            input.value = history[historyIndex];
          } else {
            historyIndex = history.length;
            input.value = "";
          }
        }
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const raw = input.value;
        input.value = "";
        const result = runHubCommand(raw);
        if (result.clear) {
          output.innerHTML = "";
          completedHTML = "";
          return;
        }
        if (raw.trim() === "") return;
        history.push(raw);
        historyIndex = history.length;
        appendLine("sotith@hub:~$ " + raw.trim(), "terminal-line-cmd");
        result.lines.forEach((line) => appendLine(line, "terminal-line-out"));
        if (result.navigate) {
          window.setTimeout(() => {
            window.location.href = result.navigate;
          }, 280);
        }
        if (result.anchor) {
          document.getElementById(result.anchor).scrollIntoView({ behavior: "smooth" });
        }
      });
    }

    setTimeout(type, 600);
  </script>

</body>
</html>
