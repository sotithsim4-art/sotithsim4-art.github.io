<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sotith Sim | Cybersecurity Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="hub-body">

  <main class="hub-main">

    <div class="hub-header">
      <div class="logo">CYBERSEC</div>
      <h1 class="hub-title">SELECT DASHBOARD</h1>
      <p class="hub-tagline">Sotith Sim — SOC Analyst • Army Veteran • Cybersecurity</p>
    </div>

    <div class="hub-terminal">
      <div class="terminal-header">
        <span class="terminal-title">BOOT SEQUENCE</span>
        <span class="terminal-dot red"></span>
        <span class="terminal-dot yellow"></span>
        <span class="terminal-dot green"></span>
      </div>
      <div class="terminal-body">
        <div id="terminal-output"></div>
        <span class="terminal-cursor">█</span>
      </div>
    </div>

    <div class="hub-grid" id="hub-grid"></div>

    <div class="hub-footer">
      <a href="https://github.com/sotithsim4-art" target="_blank">GitHub</a>
      <a href="https://tryhackme.com/p/sotithsim4" target="_blank">TryHackMe</a>
    </div>

  </main>

  <script src="dashboards.js"></script>
  <script>
    renderHub();

    const lines = bootSequenceLines();
    const output = document.getElementById("terminal-output");
    let lineIndex = 0;
    let charIndex = 0;
    let completedHTML = "";

    function type() {
      if (lineIndex >= lines.length) return;
      const line = lines[lineIndex];
      if (charIndex < line.length) {
        charIndex++;
        output.innerHTML = completedHTML + line.substring(0, charIndex);
        setTimeout(type, 30);
      } else {
        completedHTML += line + "<br/>";
        output.innerHTML = completedHTML;
        charIndex = 0;
        lineIndex++;
        setTimeout(type, 400);
      }
    }

    setTimeout(type, 600);
  </script>

</body>
</html>
